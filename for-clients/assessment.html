<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weakest Link Assessment — Business for Lawyers</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --navy: #14213D;
    --navy-deep: #0B1526;
    --navy-mid: #1C2C4F;
    --brass: #B08D57;
    --brass-light: #D9BD8C;
    --brass-dim: #5C5138;
    --oxblood: #6B2737;
    --cream: #F6F1E7;
    --paper: #FBF8F2;
    --ink: #201D1A;
    --muted: #726B60;
    --line: rgba(20,33,61,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; background:var(--cream);
  }
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  /* ---------- Nav ---------- */
  nav.sitenav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; background:var(--cream); border-bottom:1px solid var(--line);
  }
  .nav-brand{font-family:'Fraunces'; font-weight:600; font-size:17px; color:var(--navy); letter-spacing:0.01em;}
  .nav-links{display:flex; gap:28px; align-items:center;}
  .nav-links a{
    font-size:13px; font-weight:500; color:var(--muted); text-decoration:none;
    padding-bottom:2px; border-bottom:1px solid transparent; transition:all .15s ease;
  }
  .nav-links a:hover{color:var(--navy);}
  .nav-links a.active{color:var(--navy); border-bottom-color:var(--brass);}

  /* ---------- Loading / gate reuse ---------- */
  .loading-screen{
    min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse 900px 500px at 50% 0%, var(--navy-mid) 0%, var(--navy) 55%, var(--navy-deep) 100%);
  }
  .loading-screen p{color:rgba(246,241,231,0.6); font-family:'IBM Plex Sans';}

  /* ---------- Assessment page ---------- */
  .assess-wrap{max-width:760px; margin:0 auto; padding:56px 24px 90px;}
  .assess-eyebrow{
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass); margin-bottom:10px; font-weight:500; text-align:center;
  }
  .assess-head h1{font-size:30px; color:var(--navy); margin:0 0 12px; text-align:center;}
  .assess-head p{color:var(--muted); font-size:14.5px; line-height:1.6; max-width:56ch; margin:0 auto 40px; text-align:center;}

  .assess-panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:36px;
  }
  .q-block{margin-bottom:30px;}
  .q-block:last-of-type{margin-bottom:0;}
  .q-block .q-label{
    font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--brass); text-transform:uppercase;
    letter-spacing:.08em; margin-bottom:8px; display:block; font-weight:500;
  }
  .q-block p.q-text{font-size:16px; margin:0 0 14px; font-weight:500; color:var(--ink); line-height:1.4;}
  .scale{display:flex; gap:8px; flex-wrap:wrap;}
  .scale button{
    font-family:'IBM Plex Mono'; font-size:12.5px; padding:10px 16px; border-radius:6px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    cursor:pointer; transition:all .15s ease;
  }
  .scale button:hover{border-color:var(--oxblood); color:var(--oxblood);}
  .scale button.active{background:var(--navy); color:var(--cream); border-color:var(--navy);}

  .assess-submit{
    margin-top:34px; padding-top:26px; border-top:1px solid var(--line);
    display:flex; justify-content:center;
  }
  .assess-submit button{
    font-family:'IBM Plex Sans'; font-weight:600; font-size:15px; border-radius:8px;
    padding:15px 32px; background:var(--oxblood); color:#fff; border:1px solid var(--oxblood);
    cursor:pointer; transition:opacity .15s ease;
  }
  .assess-submit button:disabled{opacity:.35; cursor:not-allowed;}
  .assess-submit button:not(:disabled):hover{opacity:.88;}

  .verdict{
    display:none; margin-top:34px; padding:28px; border-radius:var(--radius);
    background:var(--navy); position:relative; overflow:hidden;
  }
  .verdict.show{display:block; animation:fadeUp .5s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .verdict .label{
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--brass-light); text-transform:uppercase;
    letter-spacing:.12em; opacity:.9;
  }
  .verdict h4{font-size:24px; margin:10px 0 12px; color:#fff;}
  .verdict p{font-size:15px; color:rgba(246,241,231,0.78); max-width:60ch; line-height:1.6; margin:0 0 22px;}
  .verdict .btn{
    display:inline-block; font-family:'IBM Plex Sans'; font-weight:600; font-size:14px;
    padding:12px 22px; border-radius:8px; background:var(--brass); color:var(--navy-deep);
    text-decoration:none; transition:background .15s ease;
  }
  .verdict .btn:hover{background:var(--brass-light);}

  @media (max-width:640px){
    nav.sitenav{padding:14px 18px; flex-direction:column; gap:10px;}
    .nav-links{gap:16px; flex-wrap:wrap; justify-content:center;}
    .assess-wrap{padding:40px 18px 60px;}
    .assess-panel{padding:24px;}
  }
</style>
</head>
<body>

<nav class="sitenav">
  <div class="nav-brand">Business for Lawyers</div>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../calculator.html">Calculator</a>
    <a href="../about.html">About</a>
    <a href="../blog.html">Blog</a>
    <a href="../guides/">Guides</a>
    <a href="../free-resources/">Free Resources</a>
    <a href="../pricing.html">Pricing</a>
    <a href="./" class="active">For Clients</a>
  </div>
</nav>

<div id="app">
  <div class="loading-screen"><p>Loading…</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){

  const firebaseConfig = {
    apiKey: "AIzaSyDf-SIetS-P7kNZ4gII7SwimRsYzp6OGF4",
    authDomain: "business-for-lawyers.firebaseapp.com",
    projectId: "business-for-lawyers",
    storageBucket: "business-for-lawyers.firebasestorage.app",
    messagingSenderId: "446377312563",
    appId: "1:446377312563:web:e9212c747b975321d97e46"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const app = document.getElementById('app');

  function renderAssessment(user){
    app.innerHTML = `
      <div class="assess-wrap">
        <div class="assess-head">
          <div class="assess-eyebrow">Client Portal · Start Here</div>
          <h1>Which link in the Promise Lifecycle is costing you the file?</h1>
          <p>Four statements, one per link. Rate how true each one is of your firm today. Your lowest score is very likely where the next client — or the next referral — is quietly being lost.</p>
        </div>

        <div class="assess-panel">
          <div class="q-block" data-q="positioning">
            <span class="q-label">Positioning · Creates the Promise</span>
            <p class="q-text">Referrers and past clients could describe, in one sentence, exactly which matters you want more of.</p>
            <div class="scale">
              <button type="button" data-v="1">1 · Not true</button>
              <button type="button" data-v="2">2</button>
              <button type="button" data-v="3">3</button>
              <button type="button" data-v="4">4</button>
              <button type="button" data-v="5">5 · Very true</button>
            </div>
          </div>
          <div class="q-block" data-q="marketing">
            <span class="q-label">Marketing · Distributes the Promise</span>
            <p class="q-text">If your two biggest referral sources disappeared tomorrow, new enquiries would keep arriving anyway.</p>
            <div class="scale">
              <button type="button" data-v="1">1 · Not true</button>
              <button type="button" data-v="2">2</button>
              <button type="button" data-v="3">3</button>
              <button type="button" data-v="4">4</button>
              <button type="button" data-v="5">5 · Very true</button>
            </div>
          </div>
          <div class="q-block" data-q="sales">
            <span class="q-label">Sales · Proves the Promise</span>
            <p class="q-text">Every enquiry gets a substantive response within one business hour, every time — regardless of who picks it up.</p>
            <div class="scale">
              <button type="button" data-v="1">1 · Not true</button>
              <button type="button" data-v="2">2</button>
              <button type="button" data-v="3">3</button>
              <button type="button" data-v="4">4</button>
              <button type="button" data-v="5">5 · Very true</button>
            </div>
          </div>
          <div class="q-block" data-q="delivery">
            <span class="q-label">Delivery · Keeps the Promise</span>
            <p class="q-text">Every client, not just the important ones, receives updates on the schedule you promised — without you personally chasing it.</p>
            <div class="scale">
              <button type="button" data-v="1">1 · Not true</button>
              <button type="button" data-v="2">2</button>
              <button type="button" data-v="3">3</button>
              <button type="button" data-v="4">4</button>
              <button type="button" data-v="5">5 · Very true</button>
            </div>
          </div>

          <div class="assess-submit">
            <button id="assessBtn" disabled>Reveal My Weakest Link →</button>
          </div>

          <div class="verdict" id="verdict">
            <span class="label">Verdict</span>
            <h4 id="verdictTitle"></h4>
            <p id="verdictText"></p>
            <a class="btn" href="./" id="verdictBtn">Back to Portal</a>
          </div>
        </div>
      </div>
    `;

    const scores = { positioning:null, marketing:null, sales:null, delivery:null };
    const blocks = document.querySelectorAll('.q-block');
    const submitBtn = document.getElementById('assessBtn');

    // Restore a previous result for this client, if one exists
    try{
      const saved = JSON.parse(localStorage.getItem('bfl_assessment_' + user.uid) || 'null');
      if(saved && saved.scores){
        Object.keys(saved.scores).forEach(key=>{
          scores[key] = saved.scores[key];
          const block = document.querySelector('.q-block[data-q="' + key + '"]');
          if(block){
            const btn = block.querySelector('.scale button[data-v="' + saved.scores[key] + '"]');
            if(btn) btn.classList.add('active');
          }
        });
        checkComplete();
      }
    }catch(e){ /* ignore malformed storage */ }

    function checkComplete(){
      const done = Object.values(scores).every(v => v !== null);
      submitBtn.disabled = !done;
    }

    blocks.forEach(block=>{
      const key = block.dataset.q;
      const buttons = block.querySelectorAll('.scale button');
      buttons.forEach(btn=>{
        btn.addEventListener('click', ()=>{
          buttons.forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          scores[key] = parseInt(btn.dataset.v, 10);
          checkComplete();
        });
      });
    });

    const verdictCopy = {
      positioning: {
        title: "Positioning is your weakest link.",
        text: "The market can't yet describe, in one sentence, which matters you actually want. Until that's fixed, marketing amplifies confusion, sales negotiates against fit, and delivery quietly serves the wrong clients well. This is almost always the first place to start.",
        href: "../positioning.html",
        cta: "See what's involved in fixing Positioning →"
      },
      marketing: {
        title: "Marketing is your weakest link.",
        text: "Your positioning is likely sound, but it isn't reaching anyone beyond the people who already know you. Growth is capped at the size of your referral network — which means one retirement or one falling-out away from a real problem.",
        href: "../marketing.html",
        cta: "See what's involved in fixing Marketing →"
      },
      sales: {
        title: "Sales is your weakest link.",
        text: "Enquiries are arriving, but too many are being lost to speed and process rather than to a better firm. This is usually the fastest link to fix, and often the one with the most immediate return.",
        href: "../sales.html",
        cta: "See what's involved in fixing Sales →"
      },
      delivery: {
        title: "Delivery is your weakest link.",
        text: "You are likely doing good work and doing it well — but the client experience in between isn't matching the promise made at the start. This is the link that quietly determines whether a well-run matter turns into a referral, or a three-star review.",
        href: "../delivery.html",
        cta: "See what's involved in fixing Delivery →"
      }
    };

    function showVerdict(){
      const entries = Object.entries(scores);
      const lowest = entries.reduce((min, cur)=> cur[1] < min[1] ? cur : min, entries[0]);
      const key = lowest[0];
      document.getElementById('verdictTitle').textContent = verdictCopy[key].title;
      document.getElementById('verdictText').textContent = verdictCopy[key].text;
      const verdictBtn = document.getElementById('verdictBtn');
      verdictBtn.textContent = verdictCopy[key].cta;
      verdictBtn.href = verdictCopy[key].href;
      document.getElementById('verdict').classList.add('show');
      try{
        localStorage.setItem('bfl_assessment_' + user.uid, JSON.stringify({ scores, weakest: key, savedAt: Date.now() }));
      }catch(e){ /* storage unavailable — verdict still shows, just won't persist */ }
      document.getElementById('verdict').scrollIntoView({ behavior:'smooth', block:'center' });
    }

    submitBtn.addEventListener('click', showVerdict);

    // If a saved result exists, show the verdict immediately
    try{
      const saved = JSON.parse(localStorage.getItem('bfl_assessment_' + user.uid) || 'null');
      if(saved && saved.weakest){
        const key = saved.weakest;
        document.getElementById('verdictTitle').textContent = verdictCopy[key].title;
        document.getElementById('verdictText').textContent = verdictCopy[key].text;
        const verdictBtn = document.getElementById('verdictBtn');
        verdictBtn.textContent = verdictCopy[key].cta;
        verdictBtn.href = verdictCopy[key].href;
        document.getElementById('verdict').classList.add('show');
      }
    }catch(e){ /* ignore */ }
  }

  auth.onAuthStateChanged((user)=>{
    if(user){
      renderAssessment(user);
    } else {
      window.location.href = './';
    }
  });

})();
</script>

</body>
</html>
