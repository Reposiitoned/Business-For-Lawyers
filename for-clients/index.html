<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Clients — Business for Lawyers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --navy: #14213D;
    --navy-deep: #0B1526;
    --navy-mid: #1C2C4F;
    --brass: #B08D57;
    --brass-light: #D9BD8C;
    --brass-dim: #5C5138;
    --oxblood: #6B2737;
    --cream: #F6F1E7;
    --paper: #FBF8F2;
    --ink: #201D1A;
    --muted: #726B60;
    --line: rgba(20,33,61,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased; background:var(--cream);
  }
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}

  /* ---------- Nav ---------- */
  nav.sitenav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; background:var(--cream); border-bottom:1px solid var(--line);
  }
  .nav-brand{font-family:'Fraunces'; font-weight:600; font-size:17px; color:var(--navy); letter-spacing:0.01em;}
  .nav-links{display:flex; gap:28px; align-items:center;}
  .nav-links a{
    font-size:13px; font-weight:500; color:var(--muted); text-decoration:none;
    padding-bottom:2px; border-bottom:1px solid transparent; transition:all .15s ease;
  }
  .nav-links a:hover{color:var(--navy);}
  .nav-links a.active{color:var(--navy); border-bottom-color:var(--brass);}

  /* ---------- Gate (threshold) ---------- */
  .gate{
    min-height:calc(100vh - 64px);
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, var(--navy-mid) 0%, var(--navy) 55%, var(--navy-deep) 100%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    padding:60px 24px; position:relative; overflow:hidden;
  }
  .gate::before{
    content:''; position:absolute; inset:0; opacity:0.05; pointer-events:none;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, var(--brass) 39px, var(--brass) 40px);
  }
  .gate-content{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; max-width:420px; text-align:center; width:100%;}
  .gate-eyebrow{
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--brass-light); margin-bottom:22px; opacity:0.85;
  }

  /* Welcome video */
  .video-frame{
    width:200px; aspect-ratio:9/16; border-radius:18px; overflow:hidden; position:relative;
    margin-bottom:26px; background:var(--navy-mid); border:2px solid var(--brass);
    box-shadow:0 24px 60px rgba(0,0,0,0.45); flex:none;
  }
  .video-frame video{width:100%; height:100%; object-fit:cover; display:block; background:#000;}
  .video-frame .video-play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(11,21,38,0.35); cursor:pointer; transition:background .15s ease;
  }
  .video-frame .video-play.hidden{display:none;}
  .video-frame .video-play:hover{background:rgba(11,21,38,0.2);}
  .video-frame .video-play svg{width:52px; height:52px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}

  .gate h1{color:#fff; font-size:26px; font-weight:600; line-height:1.25; margin:0 0 10px;}
  .gate p.gate-sub{color:rgba(246,241,231,0.62); font-size:14px; line-height:1.6; margin:0 0 30px; max-width:340px;}

  .gate-btn{
    padding:14px 30px; border-radius:8px; border:1px solid var(--brass); background:var(--brass);
    color:var(--navy-deep); font-family:'IBM Plex Sans'; font-weight:600; font-size:14px;
    cursor:pointer; transition:all .15s ease;
  }
  .gate-btn:hover{background:var(--brass-light); border-color:var(--brass-light);}

  /* ---------- Login form (on navy gate) ---------- */
  .login-field{width:100%; max-width:300px; margin-bottom:14px; text-align:left;}
  .login-field label{
    display:block; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:rgba(246,241,231,0.55); margin-bottom:6px;
  }
  .login-field input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(246,241,231,0.18);
    background:rgba(255,255,255,0.05); color:#fff; font-family:'IBM Plex Sans'; font-size:14px;
  }
  .login-field input::placeholder{color:rgba(246,241,231,0.32);}
  .login-field input:focus{outline:none; border-color:var(--brass);}
  .login-msg{
    width:100%; max-width:300px; font-size:12.5px; padding:10px 12px; border-radius:8px;
    margin-bottom:14px; display:none; text-align:left;
  }
  .login-msg.error{background:rgba(107,39,55,0.25); border:1px solid var(--oxblood); color:#F0B8C0; display:block;}
  .login-msg.success{background:rgba(76,122,90,0.2); border:1px solid #4C7A5A; color:#B7D8BF; display:block;}
  .login-forgot{
    margin-top:16px; font-size:12.5px; color:rgba(246,241,231,0.55); text-decoration:underline;
    cursor:pointer; background:none; border:none; font-family:'IBM Plex Sans';
  }

  /* ---------- Portal ---------- */
  .portal{display:none; padding:56px 32px 80px; max-width:1080px; margin:0 auto;}
  .portal.show{display:block; animation:fadeUp .5s ease;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .portal-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    margin-bottom:38px; flex-wrap:wrap;
  }
  .portal-eyebrow{
    font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass); margin-bottom:8px; font-weight:500;
  }
  .portal-head h1{font-size:30px; color:var(--navy); margin:0 0 8px;}
  .portal-head p{color:var(--muted); font-size:14.5px; max-width:520px; line-height:1.6; margin:0;}

  .account-box{
    background:var(--navy); border:1px solid var(--navy); border-radius:var(--radius);
    padding:16px 18px; min-width:200px; flex:none;
  }
  .account-email{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--brass-light); margin-bottom:10px; word-break:break-all;}
  .account-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .account-btn{
    font-family:'IBM Plex Sans'; font-size:12px; font-weight:600; color:var(--cream);
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); padding:7px 11px; border-radius:6px;
    cursor:pointer; transition:all .15s ease;
  }
  .account-btn:hover{background:var(--brass); border-color:var(--brass); color:var(--navy-deep);}

  .portal-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px;}
  .portal-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; display:flex; flex-direction:column; min-height:190px; position:relative;
  }
  .portal-card.live{border-color:var(--brass);}
  .portal-card.featured{border-color:var(--oxblood); background:var(--navy);}
  .portal-card.featured h3{color:#fff;}
  .portal-card.featured p{color:rgba(246,241,231,0.7);}
  .portal-card .card-tag{
    font-family:'IBM Plex Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    padding:3px 9px; border-radius:100px; display:inline-block; width:fit-content; margin-bottom:16px;
  }
  .card-tag.tag-live{background:var(--navy); color:var(--cream);}
  .card-tag.tag-soon{background:var(--line); color:var(--muted);}
  .card-tag.tag-start{background:var(--oxblood); color:#fff;}
  .portal-card h3{font-size:18px; color:var(--navy); margin:0 0 8px; font-weight:600;}
  .portal-card p{font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 20px; flex:1;}
  .portal-card .card-cta{
    font-family:'IBM Plex Sans'; font-size:13px; font-weight:600; text-decoration:none;
    color:var(--navy-deep); background:var(--brass); padding:9px 16px; border-radius:8px;
    display:inline-flex; align-items:center; gap:6px; width:fit-content; transition:background .15s ease;
  }
  .card-cta:hover{background:var(--brass-light);}
  .portal-card.soon{opacity:0.6;}
  .portal-card.soon .card-cta{background:var(--line); color:var(--muted); cursor:default; pointer-events:none;}

  /* ---------- Change password modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(11,21,38,0.55); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--paper); border-radius:var(--radius); padding:32px; max-width:380px; width:100%;
  }
  .modal-box h3{font-size:20px; color:var(--navy); margin:0 0 6px;}
  .modal-box .modal-sub{font-size:13px; color:var(--muted); margin:0 0 20px;}
  .modal-field{margin-bottom:14px;}
  .modal-field label{
    display:block; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--navy); margin-bottom:6px;
  }
  .modal-field input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;
    font-family:'IBM Plex Sans';
  }
  .modal-msg{font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none;}
  .modal-msg.error{background:#FBF3EC; border:1px solid var(--oxblood); color:var(--oxblood); display:block;}
  .modal-msg.success{background:#EEF5EE; border:1px solid #4C7A5A; color:#3A5E44; display:block;}
  .modal-actions{display:flex; justify-content:space-between; margin-top:20px;}
  .btn{
    font-family:'IBM Plex Sans'; font-size:13px; font-weight:500; padding:9px 16px; border-radius:8px;
    cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--navy);
  }
  .btn-primary{background:var(--navy); color:#fff; border-color:var(--navy);}

  @media (max-width:640px){
    nav.sitenav{padding:14px 18px; flex-direction:column; gap:10px;}
    .nav-links{gap:16px; flex-wrap:wrap; justify-content:center;}
    .portal{padding:40px 18px 60px;}
  }
</style>
</head>
<body>

<nav class="sitenav">
  <div class="nav-brand">Business for Lawyers</div>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../calculator.html">Calculator</a>
    <a href="../marketing.html">Marketing</a>
    <a href="../blog.html">Blog</a>
    <a href="../about.html">About</a>
    <a href="./" class="active">For Clients</a>
  </div>
</nav>

<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){

  const firebaseConfig = {
    apiKey: "AIzaSyDf-SIetS-P7kNZ4gII7SwimRsYzp6OGF4",
    authDomain: "business-for-lawyers.firebaseapp.com",
    projectId: "business-for-lawyers",
    storageBucket: "business-for-lawyers.firebasestorage.app",
    messagingSenderId: "446377312563",
    appId: "1:446377312563:web:e9212c747b975321d97e46"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const app = document.getElementById('app');

  function renderLoginGate(){
    app.innerHTML = `
      <div class="gate">
        <div class="gate-content">
          <div class="gate-eyebrow">Client Access</div>
          <h1>Some promises aren't public.</h1>
          <p class="gate-sub">Sign in with the login your Business for Lawyers contact gave you.</p>

          <div class="login-msg" id="login-msg"></div>

          <div class="login-field">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@yourfirm.com.au" autocomplete="username"/>
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
          </div>

          <button class="gate-btn" id="login-submit" style="width:100%; max-width:300px;">Sign In</button>
          <button class="login-forgot" id="forgot-btn">Forgot your password?</button>
        </div>
      </div>
    `;

    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const msgEl = document.getElementById('login-msg');
    const submitBtn = document.getElementById('login-submit');
    const forgotBtn = document.getElementById('forgot-btn');

    function showMsg(text, type){
      msgEl.textContent = text;
      msgEl.className = 'login-msg ' + type;
    }

    async function attemptLogin(){
      const email = emailInput.value.trim();
      const password = passInput.value;
      if(!email || !password){
        showMsg('Enter both your email and password.', 'error');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try{
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged handles what happens next
      }catch(e){
        showMsg('That email or password isn\'t recognised — check with your contact and try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }
    submitBtn.addEventListener('click', attemptLogin);
    [emailInput, passInput].forEach(el=> el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); }));

    forgotBtn.addEventListener('click', async ()=>{
      const email = emailInput.value.trim();
      if(!email){
        showMsg('Enter your email above first, then click this again.', 'error');
        return;
      }
      try{
        await auth.sendPasswordResetEmail(email);
        showMsg('Check your inbox — we\'ve sent a link to set a new password.', 'success');
      }catch(e){
        showMsg('Couldn\'t send that — double check the email address and try again.', 'error');
      }
    });
  }

  function renderWelcome(user){
    app.innerHTML = `
      <div class="gate" id="gate-screen">
        <div class="gate-content">
          <div class="gate-eyebrow">Client Access</div>
          <div class="video-frame" id="video-frame">
            <video id="welcome-video" poster="welcome-poster.jpg" playsinline preload="metadata">
              <source src="welcome.mp4" type="video/mp4">
            </video>
            <div class="video-play" id="video-play">
              <svg viewBox="0 0 60 60" fill="none">
                <circle cx="30" cy="30" r="29" fill="rgba(11,21,38,0.55)" stroke="#fff" stroke-width="1.5"/>
                <path d="M24 19 L42 30 L24 41 Z" fill="#fff"/>
              </svg>
            </div>
          </div>
          <h1>You're through.</h1>
          <p class="gate-sub">A quick welcome from Roy, then let's find what's holding your firm back.</p>
          <button class="gate-btn" id="gate-enter">Enter Portal →</button>
        </div>
      </div>
      <div class="portal" id="portal-screen">
        <div class="portal-head">
          <div>
            <div class="portal-eyebrow">Client Portal</div>
            <h1>Your practice, measured.</h1>
            <p>Used consistently and properly, everything here strengthens your promise, grows your practice, and gets you the outcome you came for. Start with the assessment below.</p>
          </div>
          <div class="account-box">
            <div class="account-email">${user.email}</div>
            <div class="account-actions">
              <button class="account-btn" id="change-pw-btn">Change Password</button>
              <button class="account-btn" id="sign-out-btn">Sign Out</button>
            </div>
          </div>
        </div>
        <div class="portal-grid">
          <div class="portal-card featured">
            <span class="card-tag tag-start">Start Here</span>
            <h3>Weakest Link Assessment</h3>
            <p>Four questions — one per link in the Promise Lifecycle. Find out which of Positioning, Marketing, Sales or Delivery is costing you the most files right now.</p>
            <a href="assessment.html" class="card-cta">Take the Assessment →</a>
          </div>
          <div class="portal-card live">
            <span class="card-tag tag-live">Live</span>
            <h3>KPI Dashboard</h3>
            <p>Track your firm's KPIs across Marketing, Sales and Delivery — customised to your practice area, size and stage. Log monthly, watch the trend.</p>
            <a href="promise-kpi-dashboard.html" class="card-cta">Open Dashboard →</a>
          </div>
          <div class="portal-card soon">
            <span class="card-tag tag-soon">Coming Soon</span>
            <h3>Knowledgebase</h3>
            <p>The full methodology — people, admin, leadership and finance — built out beyond the KPI model, for clients in active engagements.</p>
            <a href="#" class="card-cta">Coming Soon</a>
          </div>
          <div class="portal-card soon">
            <span class="card-tag tag-soon">Coming Soon</span>
            <h3>Resources</h3>
            <p>Templates, guides and downloads to support your engagement — added as they're built out.</p>
            <a href="#" class="card-cta">Coming Soon</a>
          </div>
        </div>
      </div>
    `;

    const enterBtn = document.getElementById('gate-enter');
    const gateScreen = document.getElementById('gate-screen');
    const portalScreen = document.getElementById('portal-screen');
    const video = document.getElementById('welcome-video');
    const playOverlay = document.getElementById('video-play');

    playOverlay.addEventListener('click', ()=>{
      video.controls = true;
      video.play();
      playOverlay.classList.add('hidden');
    });
    video.addEventListener('ended', ()=>{
      playOverlay.classList.remove('hidden');
      video.controls = false;
    });

    enterBtn.addEventListener('click', ()=>{
      gateScreen.style.transition = 'opacity 0.4s ease';
      gateScreen.style.opacity = '0';
      setTimeout(()=>{
        gateScreen.style.display = 'none';
        portalScreen.classList.add('show');
        window.scrollTo(0,0);
      }, 400);
    });

    document.getElementById('sign-out-btn').addEventListener('click', ()=>{
      auth.signOut();
    });
    document.getElementById('change-pw-btn').addEventListener('click', ()=>{
      renderChangePasswordModal(user);
    });
  }

  function renderChangePasswordModal(user){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>Change your password</h3>
        <p class="modal-sub">You'll need your current password to confirm it's you.</p>
        <div class="modal-msg" id="cp-msg"></div>
        <div class="modal-field">
          <label>Current password</label>
          <input type="password" id="cp-current" autocomplete="current-password"/>
        </div>
        <div class="modal-field">
          <label>New password</label>
          <input type="password" id="cp-new" autocomplete="new-password"/>
        </div>
        <div class="modal-field">
          <label>Confirm new password</label>
          <input type="password" id="cp-confirm" autocomplete="new-password"/>
        </div>
        <div class="modal-actions">
          <button class="btn" id="cp-cancel">Cancel</button>
          <button class="btn btn-primary" id="cp-save">Save New Password</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const msgEl = overlay.querySelector('#cp-msg');
    function showMsg(text, type){ msgEl.textContent = text; msgEl.className = 'modal-msg ' + type; }

    overlay.querySelector('#cp-cancel').addEventListener('click', ()=> overlay.remove());
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });

    overlay.querySelector('#cp-save').addEventListener('click', async ()=>{
      const current = overlay.querySelector('#cp-current').value;
      const next = overlay.querySelector('#cp-new').value;
      const confirmVal = overlay.querySelector('#cp-confirm').value;
      if(!current || !next || !confirmVal){ showMsg('Fill in all three fields.', 'error'); return; }
      if(next.length < 6){ showMsg('New password needs to be at least 6 characters.', 'error'); return; }
      if(next !== confirmVal){ showMsg('New password and confirmation don\'t match.', 'error'); return; }
      try{
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
        await user.reauthenticateWithCredential(credential);
        await user.updatePassword(next);
        showMsg('Password updated. Use it next time you sign in.', 'success');
        overlay.querySelector('#cp-current').value = '';
        overlay.querySelector('#cp-new').value = '';
        overlay.querySelector('#cp-confirm').value = '';
      }catch(e){
        showMsg('Current password not recognised — try again.', 'error');
      }
    });
  }

  function renderLoading(){
    app.innerHTML = '<div class="gate"><div class="gate-content"><p style="color:rgba(246,241,231,0.6);">Loading…</p></div></div>';
  }

  renderLoading();
  auth.onAuthStateChanged((user)=>{
    if(user){ renderWelcome(user); }
    else{ renderLoginGate(); }
  });

})();
</script>

</body>
</html>
